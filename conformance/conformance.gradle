// The same packages for TypeScript, type-checked (strict, noImplicitOverride) as ES modules against the runtime
// sources. Host types that the models import from "@vmftest/hosts" live in stock-typescript/hosts.
def stockTypeScript = conformance.dir('stock-typescript')
def stockTypeScriptGenerated = stockTypeScript.dir('build/generated')
def generateTypeScriptStockModels = tasks.register('generateTypeScriptStockModels', GenerateConformanceModelTask) {
    dependsOn compileStockGenerator
    classpath = files(stockClasses) + modelClasspath
    mainClass = 'eu.mihosoft.vmf.conformance.GenerateStockModels'
    args 'typescript', rootProject.projectDir.absolutePath, stockTypeScriptGenerated.asFile.absolutePath,
            stockPackages.asFile.absolutePath
    inputs.file stockPackages
    inputs.files stockSources
    outputs.dir stockTypeScriptGenerated
    doFirst {
        // A package removed from the list must not leave its previous output behind.
        fileSystemOperations.delete { delete(stockTypeScriptGenerated) }
    }
}
tasks.register('verifyTypeScriptStockModels', Exec) {
    group = 'verification'
    description = 'Generates TypeScript from every test-suite and vmf-jackson model package and type-checks it.'
    dependsOn generateTypeScriptStockModels, 'installPortableTypeScript'
    workingDir stockTypeScript.asFile
    commandLine 'node', rootProject.file('conformance/portable/typescript/node_modules/typescript/bin/tsc').absolutePath,
            '-p', stockTypeScript.file('tsconfig.json').asFile.absolutePath
}
