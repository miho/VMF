import javax.inject.Inject
import org.gradle.api.file.FileSystemOperations

abstract class GenerateConformanceModelTask extends JavaExec {
    @Inject
    abstract FileSystemOperations getFileSystemOperations()
}

def conformance = rootProject.layout.projectDirectory.dir('conformance')
def graphClasses = conformance.dir('build/classes/workshop')
def compileWorkshop = tasks.named('compileJavaWorkshop', JavaCompile)
def modelClasspath = sourceSets.main.runtimeClasspath + project(':vmf-runtime').sourceSets.main.runtimeClasspath
def compileJackson = tasks.named('compileWorkshopJackson', JavaCompile)
def workshopClasspath = files(compileWorkshop.flatMap { it.destinationDirectory }) +
        files(compileJackson.flatMap { it.destinationDirectory }) + compileJackson.get().classpath

def compileGraphConformance = tasks.register('compileJavaWorkshopConformance', JavaCompile) {
    dependsOn compileWorkshop, compileJackson
    source conformance.file('java/WorkshopGraphConformance.java')
    classpath = workshopClasspath
    destinationDirectory = graphClasses
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(11) }
    options.release = 11
    options.encoding = 'UTF-8'
}

def verifyJavaGraph = tasks.register('verifyJavaWorkshopConformance', JavaExec) {
    dependsOn compileGraphConformance
    classpath = files(graphClasses) + workshopClasspath
    mainClass = 'eu.mihosoft.vmf.conformance.WorkshopGraphConformance'
    args conformance.file('fixtures/workshop-operations.json').asFile.absolutePath
}

def verifyDotNet = tasks.register('testCSharpConformance', Exec) {
    dependsOn tasks.named('generateCSharpWorkshop')
    workingDir conformance.asFile
    commandLine 'dotnet', 'test', 'csharp/Vmf.CSharp.Conformance.csproj', '--configuration', 'Release',
            '--warnaserror', '-p:RestoreLockedMode=true', '--logger', 'trx',
            '--results-directory', conformance.dir('build/test-results').asFile.absolutePath
}

tasks.register('verifyCSharpConformance') {
    group = 'verification'
    description = 'Checks C# model behavior and Java interchange in JSON, XML, and YAML.'
    dependsOn verifyDotNet, verifyJavaGraph, tasks.named('verifyCSharpWorkshop'), tasks.named('verifyCSharpSnapshots')
}

