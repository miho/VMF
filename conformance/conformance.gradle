def generateConformanceModels = { String target, FileTree definitions, Directory output, String taskName ->
    tasks.register(taskName, GenerateConformanceModelTask) {
        classpath = modelClasspath
        mainClass = 'eu.mihosoft.vmf.cli.GenerateModel'
        args target, output.asFile.absolutePath
        args definitions.files.sort().collect { it.absolutePath }
        inputs.files definitions
        outputs.dir output
        doFirst {
            // A changed declaration may stop emitting some of the previous files.
            def generatedRoot = conformance.dir('build/generated').asFile.canonicalFile.toPath()
            def destination = output.asFile.canonicalFile.toPath()
            if (destination == generatedRoot || !destination.startsWith(generatedRoot)) {
                throw new GradleException("Unexpected conformance generation directory: " + destination)
            }
            fileSystemOperations.delete { delete(destination.toFile()) }
        }
    }
}

