def verifyExchange = { String taskSuffix, String runner, String directory, String variable, String fixture ->
    def interchange = conformance.dir('build/interchange/' + directory).asFile.absolutePath
    def fromJava = tasks.register('writeJavaConformance' + taskSuffix, JavaExec) {
        dependsOn compileJavaValues
        classpath = valueClasspath
        mainClass = 'eu.mihosoft.vmf.conformance.' + runner
        args 'write', interchange
        if (fixture != null) args conformance.file(fixture).asFile.absolutePath
    }
    verifyDotNet.configure {
        dependsOn fromJava
        environment variable, interchange
    }
    def toJava = tasks.register('readCSharpConformance' + taskSuffix + 'InJava', JavaExec) {
        dependsOn verifyDotNet, compileJavaValues
        classpath = valueClasspath
        mainClass = 'eu.mihosoft.vmf.conformance.' + runner
        args 'read', interchange
    }
    verification.configure { dependsOn toJava }
}

