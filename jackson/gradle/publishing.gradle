// -----------------------------------------------------------------------------
// Collect publishing information
// -----------------------------------------------------------------------------
ext.publishingInfo = [:]

ext.publishingInfo.pomName =  ext.publishingInfo.artifactId

apply from: "gradle/project-info.gradle"

// the project coordinates: the jar manifest takes the version from the project,
// not from the publication ("unspecified" otherwise)
group   = publishingInfo.groupId
version = publishingInfo.versionId
apply plugin: 'signing'

// -----------------------------------------------------------------------------
// Performs publishing
// -----------------------------------------------------------------------------

// Git resolves the repository revision from this subproject, including linked worktrees.
def buildRevision = providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

Date buildTimeAndDate = new Date()
ext {
    buildDate = new java.text.SimpleDateFormat('yyyy-MM-dd').format(buildTimeAndDate)
    buildTime = new java.text.SimpleDateFormat('HH:mm:ss.SSSZ').format(buildTimeAndDate)
}

jar {
    manifest {
        attributes(
                'Built-By': System.properties['user.name'],
                'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.properties['java.vm.version'] + ")",
                'Build-Date': project.buildDate,
                'Build-Time': project.buildTime,
                'Build-Revision': buildRevision.get(),
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

// main jar + sources jar + javadoc jar, published from the 'java' component
java {
    withJavadocJar()
    withSourcesJar()
}

// the main source set includes the sources generated by the VMF plugin
tasks.named('sourcesJar') {
    dependsOn tasks.matching { it.name == 'vmfGenModelSources' }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = publishingInfo.groupId
            artifactId = publishingInfo.artifactId
            version = publishingInfo.versionId

            from components.java

            pom {
                name = publishingInfo.pomName
                description = publishingInfo.desc
                url = publishingInfo.websiteUrl
                inceptionYear = publishingInfo.inceptionYear

                licenses {
                    license {
                        name = publishingInfo.license
                        url = publishingInfo.licenseUrl
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = publishingInfo.developerAlias
                        name = publishingInfo.developerName
                        email = publishingInfo.developerEmail
                    }
                }
                scm {
                    url = publishingInfo.vcsUrl
                    connection = publishingInfo.vcsUrl
                    developerConnection = publishingInfo.vcsUrl
                }
            }
        }
    }

    repositories {
        // --------------------------------------------------------------------------------
        // Destination Repository 'GitHubPackages'
        // -> call task 'publishMavenJavaPublicationToGitHubPackagesRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "GitHubPackages"
            url = uri(project.findProperty('publishingInfo').gitHubMavenRepo)
            credentials {
                // token with write-packages and read-packages permission: gpr.user/gpr.key
                // (gradle properties) or GITHUB_USERNAME/GITHUB_TOKEN (environment)
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'MavenCentral' (Sonatype Central Portal)
        // - releases go to the OSSRH staging API and are handed off to the Portal afterwards
        //   (scripts/publish-central.sh, docs/RELEASING.md)
        // - -SNAPSHOT versions go to the Central snapshot repository (no hand-off)
        // -> call task 'publishMavenJavaPublicationToMavenCentralRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "MavenCentral"
            def releasesRepoUrl  = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"

            url = uri(publishingInfo.versionId.endsWith('-SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)

            credentials {
                username = project.findProperty("mavenCentralUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                password = project.findProperty("mavenCentralPassword") ?: System.getenv("CENTRAL_PORTAL_PWD")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'BuildDir'
        // telling gradle to publish artifact to local directory
        // -> call task 'publishMavenJavaPublicationToBuildDirRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "BuildDir"
            url = uri("${layout.buildDirectory.get().asFile}/artifacts")
        }
    }
}

if(
        project.findProperty("signing.secretKeyRingFile")
        && project.findProperty("signing.password")
        && project.findProperty("signing.keyId")
) {

    signing {
        sign publishing.publications
    }

} else {
    println "> skipping signing, provide\n" +
            "  - 'signing.secretKeyRingFile'\n" +
            "  - 'signing.password'\n" +
            "  - 'signing.keyId'\n" +
            " to activate it\n"
}
