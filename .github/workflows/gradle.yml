name: VMF CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: vmf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / JDK ${{ matrix.jdk }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        jdk: [17, 21, 24]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            jdk: 17
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Core and the model tests compile with 11, the Gradle plugin with 17.
      # setup-java makes the last installed version the launcher.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            ${{ matrix.jdk != 17 && matrix.jdk || '' }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # VMF and VCollections live under eu/. Rebuild VMF from this checkout
      # and resolve its snapshot dependency from the configured repository.
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository/*
            !~/.m2/repository/eu
          key: maven-releases-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('maven-plugin/pom.xml') }}
          restore-keys: maven-releases-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure build toolchains and Central release mirror
        shell: bash
        run: |
          gradle_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_home/init.d" "$HOME/.m2"
          cp .github/ci/central-mirror.init.gradle "$gradle_home/init.d/"
          cp .github/ci/maven-settings.xml "$HOME/.m2/settings.xml"
          echo 'org.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_11_AARCH64,JAVA_HOME_17_AARCH64' >> "$gradle_home/gradle.properties"

      - name: Build and test
        if: runner.os != 'Windows'
        run: sh ./build-and-test-all.sh

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call build-and-test-all.bat

      - name: Set up .NET for generated model tests
        if: matrix.jdk == 17 && runner.os != 'macOS'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node for the TypeScript targets
        if: matrix.jdk == 17 && runner.os != 'macOS'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check generated C# and TypeScript models on Linux
        if: matrix.jdk == 17 && runner.os == 'Linux'
        shell: bash
        run: ./gradlew --console=plain :vmf:verifyCSharpConformance :vmf:verifyTypeScriptWorkshop :vmf:verifyTypeScriptStockModels :vmf:verifyPortableContract

      - name: Check generated C# and TypeScript models on Windows
        if: matrix.jdk == 17 && runner.os == 'Windows'
        shell: cmd
        run: call gradlew.bat --console=plain :vmf:verifyCSharpConformance :vmf:verifyTypeScriptWorkshop :vmf:verifyTypeScriptStockModels :vmf:verifyPortableContract

      - name: Set up Python for snapshot schema verification
        if: matrix.jdk == 17 && runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate generated snapshot schemas
        if: matrix.jdk == 17 && runner.os == 'Linux'
        run: |
          python -m pip install jsonschema==4.26.0
          python conformance/schema/verify.py conformance/build/interchange/schema
