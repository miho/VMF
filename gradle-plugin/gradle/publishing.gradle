if(
        project.findProperty("signing.secretKeyRingFile")
        && project.findProperty("signing.password")
        && project.findProperty("signing.keyId")
) {

    signing {
        sign publishing.publications
    }

} else {
    println "> skipping signing, provide\n" +
            "  - 'signing.secretKeyRingFile'\n" +
            "  - 'signing.password'\n" +
            "  - 'signing.keyId'\n" +
            " to activate it\n"
}

import org.gradle.plugins.signing.Sign

def isMavenLocalBuild = gradle.startParameter.taskNames.any {
    it.equalsIgnoreCase('publishToMavenLocal') || it.endsWith('ToMavenLocal')
}

def hasSigningProps = project.findProperty("signing.secretKeyRingFile") \
        && project.findProperty("signing.password") \
        && project.findProperty("signing.keyId")

tasks.withType(Sign).configureEach {
    // This prevents sign* tasks (including signPluginMavenPublication, which the
    // plugin-publish plugin registers on its own) from running at all for local
    // builds and when no signing properties are given — the message above says
    // signing is skipped, and it must be, not fail with "no configured signatory"
    onlyIf { !isMavenLocalBuild && hasSigningProps }
}

tasks.register('releaseToCentralPortal') {
    group = 'publishing'
    description = 'Hands off the last non-SNAPSHOT upload to the Central Portal so it appears under Deployments.'

    // capture inputs at configuration time so the doLast body does not touch
    // Task.project at execution time (deprecated in Gradle 9, removed in 10; config-cache safe)
    def versionId              = publishingInfo.versionId
    def sonatypeNamespaceProp  = project.providers.gradleProperty('sonatypeNamespace')
    def usernameProp           = project.providers.gradleProperty('mavenCentralUsername')
    def tokenProp              = project.providers.gradleProperty('mavenCentralPassword')
    def publishingTypeProp     = project.providers.gradleProperty('publishingType')
    def repositoryKeyProp      = project.providers.gradleProperty('repositoryKey')

    doLast {
        if (versionId.endsWith('-SNAPSHOT')) {
            println "Version '${versionId}' is a SNAPSHOT. Skipping Portal hand-off."
            return
        }

        if (!sonatypeNamespaceProp.present) {
            throw new InvalidUserDataException("Provide -PsonatypeNamespace=your.namespace")
        }
        if (!usernameProp.present || !tokenProp.present) {
            throw new InvalidUserDataException("Missing Central Portal token username/password.")
        }

        def sonatypeNamespace = sonatypeNamespaceProp.get()
        def username = usernameProp.get()
        def token    = tokenProp.get()
        def publishingType = (publishingTypeProp.getOrNull() ?: 'user_managed') as String

        // Optional fallback: pass -PrepositoryKey=<key> to hand off a specific repo
        def repositoryKey = repositoryKeyProp.getOrNull() as String

        String apiUrl = repositoryKey ?
                "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${repositoryKey}?publishing_type=${publishingType}" :
                "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${sonatypeNamespace}?publishing_type=${publishingType}"

        println "--> Handing off ${repositoryKey ? "repositoryKey=${repositoryKey}" : "namespace=${sonatypeNamespace}"} to Central (publishing_type=${publishingType})..."

        HttpURLConnection connection = (HttpURLConnection) new URL(apiUrl).openConnection()
        try {
            def bearer = "${username}:${token}".bytes.encodeBase64().toString()
            connection.setRequestProperty('Authorization', "Bearer ${bearer}") // Bearer + base64(user:pass)
            connection.requestMethod = 'POST'
            connection.connectTimeout = 60_000
            connection.readTimeout    = 300_000

            def code = connection.responseCode
            def body = (code >= 400 ? connection.errorStream : connection.inputStream)?.getText('UTF-8')
            println "HTTP ${code} ${connection.responseMessage}"
            if (body) println "Response:\n${body}"
            if (code >= 400) throw new GradleException("Portal hand-off failed with HTTP ${code}")
        } finally {
            connection.disconnect()
        }

        println "\nSuccess. Check https://central.sonatype.com/publishing/deployments"
    }
}
