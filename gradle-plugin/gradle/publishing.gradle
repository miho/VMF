Date buildTimeAndDate = new Date()
ext {
    buildDate = new java.text.SimpleDateFormat('yyyy-MM-dd').format(buildTimeAndDate)
    buildTime = new java.text.SimpleDateFormat('HH:mm:ss.SSSZ').format(buildTimeAndDate)
}

jar {
    manifest {
        attributes(
                'Built-By': System.properties['user.name'],
                'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.properties['java.vm.version'] + ")",
                'Build-Date': project.buildDate,
                'Build-Time': project.buildTime,
                'Build-Revision': versioning.info.commit,
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}


def pomConfig = {
    name ext.publishingInfo.pomName
    description ext.publishingInfo.desc
    url ext.publishingInfo.websiteUrl
    inceptionYear ext.publishingInfo.inceptionYear
    licenses {
        license([:]) {
            name ext.publishingInfo.license
            url ext.publishingInfo.licenseUrl
            distribution 'repo'
        }
    }
    scm {
        url ext.publishingInfo.vcsUrl
        connection ext.publishingInfo.vcsUrl
        developerConnection ext.publishingInfo.vcsUrl
    }
    developers {
        developer {
            id ext.publishingInfo.developerNameAlias
            name ext.publishingInfo.developerName
        }
    }
}



// This replaces the old manual `javadocJar` and `sourcesJar` tasks.
java {
    withJavadocJar()
    withSourcesJar()
}

// REMOVED: The old manual tasks for javadocJar, sourcesJar, and the `artifacts {}`
// block are no longer needed with the modern `java` component configuration above.

def centralPomMetadata = { org.gradle.api.publish.maven.MavenPom pom ->
    pom.url = publishingInfo.websiteUrl
    pom.inceptionYear = publishingInfo.inceptionYear
    pom.licenses {
        license {
            name = publishingInfo.license
            url = publishingInfo.licenseUrl
            distribution = 'repo'
        }
    }
    pom.developers {
        developer {
            id = publishingInfo.developerAlias
            name = publishingInfo.developerName
            email = publishingInfo.developerEmail
        }
    }
    pom.scm {
        url = publishingInfo.vcsUrl
        connection = publishingInfo.vcsUrl
        developerConnection = publishingInfo.vcsUrl
    }
}

publishing {
    // java-gradle-plugin creates the publications of this build itself, lazily:
    //   - 'pluginMaven'               the plugin jar (+ sources, javadoc) from components.java
    //   - 'vmfPluginPluginMarkerMaven' the marker POM for the plugin id eu.mihosoft.vmf
    // The marker POM depends on pluginMaven's coordinates, so pluginMaven gets the
    // publishingInfo coordinates (eu.mihosoft.vmf:vmf-gradle-plugin) below instead of
    // a second, hand-written 'mavenJava' publication of the same jar — 0.2.11 was
    // published that way and its marker never reached Maven Central.
    publications.configureEach { pub ->
        if (pub.name == 'pluginMaven') {
            pub.groupId = publishingInfo.groupId
            pub.artifactId = publishingInfo.artifactId
            pub.version = publishingInfo.versionId
            pub.pom { org.gradle.api.publish.maven.MavenPom p ->
                p.name = publishingInfo.pomName
                p.description = publishingInfo.desc
            }
            centralPomMetadata(pub.pom)
        } else if (pub.name.endsWith('PluginMarkerMaven')) {
            // the marker keeps the plugin id as its artifactId; group and version
            // follow the plugin (the project version is set above as well)
            pub.groupId = publishingInfo.groupId
            pub.version = publishingInfo.versionId
            // name/description come from the gradlePlugin { } declaration
            centralPomMetadata(pub.pom)
        }
    }

    repositories {
        // --------------------------------------------------------------------------------
        // Destination Repository 'GitHubPackages'
        // -> call task 'publishMavenJavaPublicationToGitHubPackagesRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "GitHubPackages"
            // see https://levelup.gitconnected.com/publish-a-maven-package-to-github-with-gradle-fabc6de24d6
            // Replace OWNER and REPOSITORY with your GitHub username/repository
            // (must be both lowercase according to the documenations)
            // url = uri("https://maven.pkg.github.com/OWNER/REPOSITORY")
            url = uri(project.findProperty('publishingInfo').gitHubMavenRepo)
            credentials {
                // Make sure to generate a token with write-packages and read-packages permission:
                // https://github.com/settings/tokens/new
                // You can either store the username and token in
                //   ~/.gradle/gradle.properties (use the gpr.user and gpr.key keys)
                // Or you can store them as environment variables e.g. in ~/.bash_profile or ~/.zsh
                // depending on your shell (GITHUB_USERNAME and GITHUB_TOKEN keys)
                // Or you pass them via CLI: gradle publish -Pgpr.user=username -Pgpr.key=token
                // See at EOF for examples on how to store the credentials
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'OSSRH'
        // telling gradle to publish artifact to local directory
        // -> call task 'publishMavenJavaPublicationToOSSRHRepository' to publish
        // -> go to https://oss.sonatype.org/#stagingRepositories, click 'close', drink coffee and then click 'release'
        //    if closing was successful
        // --------------------------------------------------------------------------------
//        maven {
//            name = "OSSRH"
//            url "https://oss.sonatype.org/service/local/staging/deploy/maven2"
//            credentials {
//                username = project.findProperty("oss.user") ?: System.getenv("OSS_USERNAME")
//                password = project.findProperty("oss.pwd") ?: System.getenv("OSS_PWD")
//            }
//        }
        maven {
            name = "MavenCentral"

            def releasesRepoUrl  = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"

            url = uri(publishingInfo.versionId.endsWith('-SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)

            credentials {
                username = project.findProperty("mavenCentralUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                password = project.findProperty("mavenCentralPassword") ?: System.getenv("CENTRAL_PORTAL_PWD")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'BuildDir'
        // telling gradle to publish artifact to local directory
        // -> call task 'publishMavenJavaPublicationToBuildDirRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "BuildDir"
            url = uri(layout.buildDirectory.dir('artifacts').get().asFile)
        }
    }


